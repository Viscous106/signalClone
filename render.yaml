# One service: the API serves the frontend, so there is nothing to deploy twice.
services:
  - type: web
    name: signal-clone
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      # The default in config.py is a development placeholder.
      - key: JWT_SECRET
        generateValue: true

# The free plan does not allow a persistent disk, so the database lives in the
# container and is rebuilt from the seed on every boot. Demo data is always
# present; anything a visitor creates is lost when the instance restarts or
# spins down.
#
# To keep data, move off the free plan and add a disk. The image already
# points the database at /data, so nothing else changes:
#
#   plan: starter
#   disk:
#     name: signal-data
#     mountPath: /data
#     sizeGB: 1
